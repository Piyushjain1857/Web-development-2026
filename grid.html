<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 80px 450px 60px;
            gap: 10px;
        }

        .container div {
            background-color: rgb(167, 186, 190);
            padding: 30px;
            text-align: center;
        }

        .header,
        .footer {
            grid-column: 1 / 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">Box 1</div>
        <div class="sidebar">Box 2</div>
        <div class="content">Box 3</div>
        <div class="footer">Box 4</div>
    </div>
</body>

</html>
