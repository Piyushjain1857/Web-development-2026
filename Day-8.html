<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color Patterns</title>
    <link rel="stylesheet" href="./Day-8.css">
</head>

<body>

    <h1>CSS Color Code Patterns</h1>

    <!-- 1. HEX Color -->
    <div class="color-box hex">
        <h2>1. HEX</h2>
        <p>Example: #FF5733</p>
    </div>

    <!-- 2. RGB Color -->
    <div class="color-box rgb">
        <h2>2. RGB</h2>
        <p>Example: rgb(52, 152, 219)</p>
    </div>

    <!-- 3. RGBA Color -->
    <div class="color-box rgba">
        <h2>3. RGBA</h2>
        <p>Example: rgba(46, 204, 113, 0.7)</p>
    </div>

    <!-- 4. HSL Color -->
    <div class="color-box hsl">
        <h2>4. HSL</h2>
        <p>Example: hsl(280, 70%, 60%)</p>
    </div>

</body>

</html>
