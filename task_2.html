<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Boxes</title>

    <style>
        .box {
            width: 400px;
            height: 400px;
            position: absolute;
            color: white;
            font-size: 60px;
            text-align: center;
        }

        .box1 {
            background-color: #9bc9da;
            top: 30px;
            left: 30px;
            z-index: 5;
        }

        .box2 {
            background-color: #52b3d2;
            top: 110px;
            left: 110px;
            z-index: 4;
        }

        .box3 {
            background-color: #0da0d1;
            top: 190px;
            left: 190px;
        }
    </style>
</head>

<body>

    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>

</body>
</html>
