<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            
        }

        div{
            width: 400px;
            height: 400px;
            background-color: blue;
            border: 20px solid black;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }

        p {
            margin: 20px;
            padding: 20px;
        }

        p.dotted {
            border-style: dotted;
            border-width: 5px;
            border-color: blue;
        }

        p.dashed {
            border-style: dashed;
        }

        p.solid {
            border-style: solid;
        }

        p.double {
            border-style: double;
        }

        p.groove {
            border-style: groove;
        }

        p.ridge {
            border-style: ridge;
        }

        p.inset {
            border-style: inset;
        }

        p.outset {
            border-style: outset;
        }

        p.none {
            border-style: none;
        }

        p.hidden {
            border-style: hidden;
        }

        p.mix {
            border-style: dotted dashed solid double;
        }
    </style>
</head>

<body>

    <p class="outset">An outset border.</p>
    <p class="none">No border.</p>
    <p class="hidden">A hidden border.</p>
    <p class="mix">A mixed border.</p>
    -->

    </div>
</body>

</html>
