<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            background-color: white;
            color: black;
            padding: 20px;
            margin: 50px;
            border: 1px solid black;
            border-radius: 10px;
            position: relative;
        }

        .offer {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            padding: 5px;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <span class="offer">20% OFF</span>
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
        <h2>Running Shoes</h2>
        <p>Comfortable and stylish running shoes.</p>
        <h3>₹1999</h3>
        <button>Buy Now</button>
    </div>
</body>

</html>
